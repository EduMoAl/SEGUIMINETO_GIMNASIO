<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070c">
  <title>EDUX TRAINING</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fuentes/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Juego de iconos de línea (un solo estilo para toda la app) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></symbol>
      <symbol id="i-historial" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></symbol>
      <symbol id="i-progreso" viewBox="0 0 24 24"><path d="M3.5 20.5h17M6 15.5l4.5-4.5 3.5 3 5.5-6.5"/><path d="M15.5 7.5h3.5V11"/></symbol>
      <symbol id="i-perfil" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
      <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-cambiar" viewBox="0 0 24 24"><path d="M7 4 3.5 7.5 7 11M3.5 7.5H17M17 13l3.5 3.5L17 20M20.5 16.5H7"/></symbol>
      <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-temporizador" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></symbol>
      <symbol id="i-trofeo" viewBox="0 0 24 24"><path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4.5a3 3 0 0 0 3.2 3.7M16.5 6h3a3 3 0 0 1-3.2 3.7M12 13.5V17M8 20.5h8M9.5 17h5"/></symbol>
      <symbol id="i-llama" viewBox="0 0 24 24"><path d="M12 3c.8 3.6 4.8 5.2 4.8 10a4.8 4.8 0 0 1-9.6 0c0-2.6 1.5-3.8 2-5.6.9 1 1.3 2 1.6 3 1-1.8 1.5-4.4 1.2-7.4z"/></symbol>
      <symbol id="i-pesa" viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
      <symbol id="i-refrescar" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6M20.5 4v4.5H16"/></symbol>
      <symbol id="i-atras" viewBox="0 0 24 24"><path d="m14.5 18-6-6 6-6"/></symbol>
      <symbol id="i-sig" viewBox="0 0 24 24"><path d="m9.5 18 6-6-6-6"/></symbol>
      <symbol id="i-abajo" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
      <symbol id="i-bascula" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.5-2"/></symbol>
      <symbol id="i-nota" viewBox="0 0 24 24"><path d="M4.5 19.5h4l10-10-4-4-10 10zM13 7l4 4"/></symbol>
      <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 3 5.5 13.5H11L10 21l7.5-10.5H12z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
      <symbol id="i-subir" viewBox="0 0 24 24"><path d="M12 15.5V4M7 8.5l5-5 5 5M4.5 15v4a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-4"/></symbol>
      <symbol id="i-anterior" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.5H8M12 8v4l3 2"/></symbol>
      <symbol id="i-musculo" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M6 9h12M12 9v6M8.5 21 12 15l3.5 6"/></symbol>
      <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8v.01"/></symbol>
      <symbol id="i-sonido" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-vibrar" viewBox="0 0 24 24"><rect x="7.5" y="3.5" width="9" height="17" rx="2"/><path d="M4.5 8v8M19.5 8v8"/></symbol>
      <symbol id="i-enlace" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    </defs>
  </svg>

  <header id="barra" class="barra"></header>
  <div id="progreso-sesion" class="progreso-sesion" hidden><div class="relleno"></div></div>

  <main id="vista"></main>

  <!-- Isla inferior durante la sesión: descanso + terminar -->
  <div id="dock" class="dock" hidden>
    <div id="descanso" class="descanso" hidden>
      <svg class="descanso-anillo" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="19" class="pista"/>
        <circle cx="22" cy="22" r="19" class="arco" pathLength="100"/>
      </svg>
      <div class="descanso-info">
        <span class="descanso-etiqueta">Descanso</span>
        <span class="descanso-tiempo">0:00</span>
      </div>
      <button class="chip" data-accion="descanso-menos" aria-label="Quitar 15 segundos">−15</button>
      <button class="chip" data-accion="descanso-mas" aria-label="Añadir 15 segundos">+15</button>
      <button class="chip fuerte" data-accion="descanso-saltar">Saltar</button>
      <div class="descanso-barra" hidden><div class="descanso-relleno"></div></div>
    </div>
    <button class="btn primario ancho" data-accion="terminar"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg>Terminar sesión</button>
  </div>

  <nav id="nav" class="nav">
    <button data-tab="inicio" aria-label="Inicio"><svg class="ico"><use href="#i-inicio"/></svg><span>Inicio</span></button>
    <button data-tab="historial" aria-label="Historial"><svg class="ico"><use href="#i-historial"/></svg><span>Historial</span></button>
    <button data-tab="progreso" aria-label="Progreso"><svg class="ico"><use href="#i-progreso"/></svg><span>Progreso</span></button>
    <button data-tab="perfil" aria-label="Perfil"><svg class="ico"><use href="#i-perfil"/></svg><span>Perfil</span></button>
    <button data-tab="ajustes" aria-label="Ajustes"><svg class="ico"><use href="#i-ajustes"/></svg><span>Ajustes</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="rutina.js"></script>
  <script src="almacen.js"></script>
  <script src="datos.js"></script>
  <script src="red.js"></script>
  <script src="grafico.js"></script>
  <script src="cuerpo.js"></script>
  <script src="descanso.js"></script>
  <script src="sesion.js"></script>
  <script src="vistas.js"></script>
  <script src="app.js"></script>
</body>
</html>
